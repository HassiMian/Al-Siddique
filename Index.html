<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Al Siddique Scholars — Curriculum Intelligence Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0B2C4D; --navy-2:#12406B; --sky:#2E75B6; --teal:#0F6E56; --teal-2:#1D9E75;
    --sand:#FAFAF7; --sand-2:#F1EFE8; --ink:#121826; --ink-2:#3A4253; --mute:#6B7280;
    --line:#E5E7EB; --line-2:#D1D5DB; --danger:#991B1B; --warn:#B45309; --ok:#0F6E56;
    --radius:12px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(11,44,77,.06); --shadow:0 4px 16px rgba(11,44,77,.08);
    --shadow-lg:0 12px 40px rgba(11,44,77,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sand)}
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--sky);text-decoration:none}
  a:hover{text-decoration:underline}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  .hidden{display:none!important}

  /* ============ SHELL ============ */
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .sidebar{background:var(--navy);color:#D9E2EC;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
  .brand-badge{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2E75B6,#1D9E75);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm)}
  .brand-text{line-height:1.15}
  .brand-text b{color:#fff;display:block;font-size:13px;font-weight:600}
  .brand-text span{font-size:11px;color:#9FB3C8}
  .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7B8FA1;padding:10px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#C7D3E0;font-size:13.5px;margin-bottom:2px;transition:all .15s}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:linear-gradient(90deg,rgba(46,117,182,.25),rgba(29,158,117,.12));color:#fff;font-weight:600}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;opacity:0;transition:opacity .2s}
  .nav-item.active .dot{opacity:1}

  .main{padding:28px 36px 60px;max-width:1400px;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .topbar h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.3px}
  .topbar .sub{font-size:13px;color:var(--mute);margin-top:2px}
  .top-actions{display:flex;gap:8px;align-items:center}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink);transition:all .15s;box-shadow:var(--shadow-sm)}
  .btn:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn-primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
  .btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn-teal:hover{background:var(--teal-2);border-color:var(--teal-2)}
  .btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-danger{color:var(--danger);border-color:#FECACA;background:#FEF2F2}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .card-title{font-size:14px;font-weight:600;margin:0 0 4px}
  .card-sub{font-size:12px;color:var(--mute);margin-bottom:14px}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .stat .value{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
  .stat .delta{font-size:11px;color:var(--teal);margin-top:2px}

  .row{display:grid;gap:14px}
  .row-2{grid-template-columns:1.4fr 1fr}
  .row-3{grid-template-columns:repeat(3,1fr)}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .field input, .field select, .field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;transition:border .15s, box-shadow .15s}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,117,182,.12)}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:var(--sand-2);border-radius:20px;font-size:11px;color:var(--ink-2);font-weight:500}
  .chip-teal{background:#E7F6EF;color:var(--teal)}
  .chip-sky{background:#E3EEF9;color:var(--sky)}
  .chip-amber{background:#FEF3C7;color:var(--warn)}
  .chip-red{background:#FEE2E2;color:var(--danger)}
  .chip-navy{background:var(--navy);color:#fff}

  /* Drop zone */
  .dropzone{border:2px dashed var(--line-2);border-radius:var(--radius-lg);padding:40px 20px;text-align:center;background:#fff;transition:all .2s}
  .dropzone.dragover{border-color:var(--sky);background:#F0F7FD}
  .dropzone-ico{width:54px;height:54px;margin:0 auto 10px;border-radius:14px;background:linear-gradient(135deg,#E3EEF9,#D6E9F5);display:flex;align-items:center;justify-content:center;font-size:22px}
  .dropzone h3{margin:0 0 4px;font-size:16px}
  .dropzone p{margin:0;font-size:13px;color:var(--mute)}

  /* Table */
  table.ttbl{width:100%;border-collapse:collapse}
  table.ttbl th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--sand)}
  table.ttbl td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  table.ttbl tr:hover{background:var(--sand)}

  .list{display:flex;flex-direction:column;gap:8px}
  .list-item{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:all .15s}
  .list-item:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}

  /* Modal */
  .modal-back{position:fixed;inset:0;background:rgba(11,26,46,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .modal{background:#fff;border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg)}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{margin:0;font-size:17px}
  .modal-body{padding:20px 22px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--sand)}

  /* Chapter tree */
  .tree{display:flex;flex-direction:column;gap:4px}
  .tree-ch{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tree-ch-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
  .tree-ch-head:hover{background:var(--sand)}
  .tree-topics{padding:4px 10px 10px 36px;display:none;border-top:1px solid var(--line);background:var(--sand)}
  .tree-ch.open .tree-topics{display:block}
  .tree-topic{padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-radius:6px}
  .tree-topic:hover{background:#fff}

  .empty{text-align:center;padding:40px 20px;color:var(--mute)}
  .empty-ico{font-size:38px;opacity:.4;margin-bottom:8px}

  /* Chat */
  .chat-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;height:65vh}
  .chat-messages{flex:1;overflow-y:auto;padding:18px}
  .chat-msg{margin-bottom:14px;max-width:80%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
  .chat-msg.user{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .chat-msg.bot{background:var(--sand-2);color:var(--ink);border-bottom-left-radius:4px}
  .chat-input{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:var(--sand)}
  .chat-input input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px}

  /* Progress */
  .progress{height:6px;background:var(--sand-2);border-radius:3px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--teal));transition:width .3s}

  /* Question preview */
  .qp{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
  .qp-stem{font-weight:500;margin-bottom:8px;line-height:1.5}
  .qp-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .qp-opt{padding:6px 10px;background:var(--sand);border-radius:6px;font-size:13px}
  .qp-opt.correct{background:#E7F6EF;color:var(--teal);font-weight:500}
  .qp-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;font-size:11px}

  /* Lesson plan */
  .lp-section{margin-bottom:18px}
  .lp-section h4{margin:0 0 6px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}

  /* Toast */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:100;font-size:13px;animation:slideIn .3s}
  @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* Loader */
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  .spinner-dark{border-color:rgba(11,44,77,.2);border-top-color:var(--navy)}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media print{
    .sidebar,.topbar,.top-actions,.btn,nav{display:none!important}
    .main{padding:0;max-width:100%}
    .app{grid-template-columns:1fr}
    .card{border:none;box-shadow:none;padding:0}
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">AS</div>
      <div class="brand-text">
        <b>Al Siddique Scholars</b>
        <span>Curriculum Intelligence</span>
      </div>
    </div>

    <div class="nav-section">Workspace</div>
    <div class="nav-item active" data-view="dashboard"><span class="dot"></span>📊 Dashboard</div>
    <div class="nav-item" data-view="upload"><span class="dot"></span>📤 Upload Center</div>
    <div class="nav-item" data-view="syllabus"><span class="dot"></span>📚 Syllabus / Chapters</div>
    <div class="nav-item" data-view="qgen"><span class="dot"></span>✨ Question Generator</div>
    <div class="nav-item" data-view="bank"><span class="dot"></span>🗂️ Question Bank</div>
    <div class="nav-item" data-view="exam"><span class="dot"></span>📝 Exam Builder</div>
    <div class="nav-item" data-view="lesson"><span class="dot"></span>🎓 Lesson Planner</div>
    <div class="nav-item" data-view="assistant"><span class="dot"></span>🤖 AI Assistant</div>

    <div class="nav-section" style="margin-top:14px">Admin</div>
    <div class="nav-item" data-view="settings"><span class="dot"></span>⚙️ Settings &amp; API Key</div>
    <div class="nav-item" data-view="about"><span class="dot"></span>ℹ️ About / Help</div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main">
    <!-- Views get rendered here -->
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   AL SIDDIQUE CURRICULUM INTELLIGENCE — SINGLE FILE APP
   Storage: localStorage (no server, no hosting needed)
   AI: uses user's Anthropic / OpenAI API key, stored locally
============================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- STORAGE LAYER ---------- */
const DB_KEY = 'al-siddique-db-v1';
const defaultDB = {
  textbooks: [],      // {id, title, subject, grade, board, pages, createdAt, chapters:[{id,number,title,topics:[{id,number,title,pageStart,pageEnd,content}]}]}
  questions: [],      // {id, textbookId, chapterId, topicId, type, difficulty, stem, options, answer, explanation, tags}
  papers: [],         // {id, title, class, subject, config, sections:[{title, questions:[qid]}], createdAt}
  lessonPlans: [],    // {id, title, class, topicId, plan, createdAt}
  settings: { apiKey:'', provider:'anthropic', schoolName:'Al Siddique Scholars', teacherName:'' }
};

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return {...defaultDB};
    const parsed = JSON.parse(raw);
    return {...defaultDB, ...parsed, settings:{...defaultDB.settings, ...(parsed.settings||{})}};
  }catch(e){ return {...defaultDB} }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)) }
let DB = loadDB();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7) }

/* ---------- ROUTER ---------- */
let currentView = 'dashboard';
function go(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  render();
}
document.querySelectorAll('.nav-item').forEach(n=> n.addEventListener('click', ()=> go(n.dataset.view)));

/* ---------- TOASTS ---------- */
function toast(msg, ms=2400){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=> t.remove(), ms);
}

/* ---------- MODAL ---------- */
function modal({title, body, actions=[]}){
  const root = document.getElementById('modalRoot');
  const back = document.createElement('div'); back.className='modal-back';
  back.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2>${title}</h2><button class="btn btn-ghost" id="_close">✕</button></div>
      <div class="modal-body" id="_mbody"></div>
      <div class="modal-foot" id="_mfoot"></div>
    </div>`;
  back.addEventListener('click', close);
  root.appendChild(back);
  const mb = back.querySelector('#_mbody');
  if(typeof body === 'string') mb.innerHTML = body; else mb.appendChild(body);
  const mf = back.querySelector('#_mfoot');
  actions.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'btn ' + (a.primary?'btn-primary':'');
    b.textContent = a.label;
    b.onclick = ()=>{ a.onClick && a.onClick(close); };
    mf.appendChild(b);
  });
  back.querySelector('#_close').onclick = close;
  function close(){ back.remove() }
  return { close };
}

/* ---------- AI CALL ---------- */
async function callAI(systemPrompt, userPrompt, {jsonMode=true}={}){
  const {apiKey, provider} = DB.settings;
  if(!apiKey){
    throw new Error('Please add your AI API key in Settings first (Anthropic or OpenAI).');
  }
  if(provider === 'anthropic'){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-5-20250929',
        max_tokens: 4000,
        system: systemPrompt,
        messages:[{role:'user', content: userPrompt}]
      })
    });
    if(!res.ok){
      const err = await res.text();
      throw new Error('API Error: ' + err.slice(0,300));
    }
    const data = await res.json();
    return data.content[0].text;
  } else {
    // OpenAI
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model:'gpt-4o',
        messages:[
          {role:'system', content: systemPrompt},
          {role:'user', content: userPrompt}
        ],
        max_tokens: 4000,
        ...(jsonMode ? {response_format:{type:'json_object'}} : {})
      })
    });
    if(!res.ok){
      const err = await res.text();
      throw new Error('API Error: ' + err.slice(0,300));
    }
    const data = await res.json();
    return data.choices[0].message.content;
  }
}

function parseJSON(text){
  // Extract JSON from possibly-wrapped response
  const m = text.match(/```json\s*([\s\S]*?)```/) || text.match(/```\s*([\s\S]*?)```/);
  let t = m ? m[1] : text;
  // Find first { or [
  const start = Math.min(...['{','['].map(c => {const i=t.indexOf(c); return i<0?Infinity:i}));
  const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(start < Infinity && end > start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

/* ============================================================
   VIEW: DASHBOARD
============================================================ */
function viewDashboard(){
  const tb = DB.textbooks.length;
  const ch = DB.textbooks.reduce((s,b)=>s+(b.chapters?.length||0),0);
  const qb = DB.questions.length;
  const papers = DB.papers.length;
  const plans = DB.lessonPlans.length;

  return `
  <div class="topbar">
    <div>
      <h1>Assalam o Alaikum${DB.settings.teacherName? ', '+DB.settings.teacherName : ''} 👋</h1>
      <div class="sub">${DB.settings.schoolName} — ${new Date().toLocaleDateString('en-PK', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="go('upload')">📤 Upload Textbook</button>
      <button class="btn btn-primary" onclick="go('qgen')">✨ Generate Questions</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="label">Textbooks</div><div class="value">${tb}</div><div class="delta">Ingested &amp; ready</div></div>
    <div class="stat"><div class="label">Chapters</div><div class="value">${ch}</div><div class="delta">Across all books</div></div>
    <div class="stat"><div class="label">Question Bank</div><div class="value">${qb}</div><div class="delta">Reusable questions</div></div>
    <div class="stat"><div class="label">Exam Papers</div><div class="value">${papers}</div><div class="delta">${plans} lesson plans</div></div>
  </div>

  <div class="row row-2">
    <div class="card">
      <div class="card-title">Quick Actions</div>
      <div class="card-sub">2–3 clicks to any task. Pick your next action.</div>
      <div class="list">
        <div class="list-item" onclick="go('upload')">
          <div><b>📤 Upload a textbook</b><div style="font-size:12px;color:var(--mute);margin-top:2px">Start by uploading a PDF book for any class</div></div>
          <button class="btn btn-sm">Open →</button>
        </div>
        <div class="list-item" onclick="go('qgen')">
          <div><b>✨ Generate questions from a chapter</b><div style="font-size:12px;color:var(--mute);margin-top:2px">MCQ, short, long, fill-in-the-blanks — based only on your uploaded book</div></div>
          <button class="btn btn-sm">Open →</button>
        </div>
        <div class="list-item" onclick="go('exam')">
          <div><b>📝 Build an exam paper</b><div style="font-size:12px;color:var(--mute);margin-top:2px">Choose chapters, marks distribution → instant paper + PDF export</div></div>
          <button class="btn btn-sm">Open →</button>
        </div>
        <div class="list-item" onclick="go('lesson')">
          <div><b>🎓 Create a lesson plan</b><div style="font-size:12px;color:var(--mute);margin-top:2px">Daily / weekly plans with objectives, activities, assessment</div></div>
          <button class="btn btn-sm">Open →</button>
        </div>
        <div class="list-item" onclick="go('assistant')">
          <div><b>🤖 Ask the AI assistant</b><div style="font-size:12px;color:var(--mute);margin-top:2px">Explain any topic — simple, medium, advanced levels</div></div>
          <button class="btn btn-sm">Open →</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Recent Textbooks</div>
        <div class="card-sub">Your uploaded books</div>
        ${DB.textbooks.length === 0 ? `
          <div class="empty">
            <div class="empty-ico">📚</div>
            <div style="font-size:13px;margin-bottom:10px">No books yet</div>
            <button class="btn btn-primary btn-sm" onclick="go('upload')">Upload First Book</button>
          </div>
        ` : DB.textbooks.slice(0,4).map(b=>`
          <div class="list-item" onclick="viewBook('${b.id}')" style="margin-bottom:6px;padding:10px 12px">
            <div style="overflow:hidden">
              <b style="font-size:13px">${b.title}</b>

async function processPDF(file, book){
  const m = modal({
    title:'Processing '+book.title,
    body: `<div id="proc">
      <div style="font-size:13px;color:var(--mute);margin-bottom:8px" id="procStatus">Reading PDF...</div>
      <div class="progress"><div class="progress-fill" id="procBar" style="width:10%"></div></div>
      <div style="font-size:12px;color:var(--mute);margin-top:12px" id="procSub">Please wait, this runs in your browser.</div>
    </div>`,
    actions:[]
  });
  const st = document.getElementById('procStatus');
  const bar = document.getElementById('procBar');
  const sub = document.getElementById('procSub');

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    book.pages = pdf.numPages;
    let allText = '';
    const perPage = [];
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(it=>it.str).join(' ').replace(/\s+/g,' ').trim();
      perPage.push({page:i, text: pageText});
      allText += `\n[Page ${i}] ${pageText}`;
      const pct = 10 + Math.floor((i/pdf.numPages)*50);
      bar.style.width = pct+'%';
      st.textContent = `Reading page ${i} of ${pdf.numPages}...`;
    }
    book.rawText = allText;
    book.perPage = perPage;

    // Quality check: if extracted text is garbage, warn
    const junkRatio = allText.replace(/[^a-zA-Z\s]/g,'').length / Math.max(allText.length,1);
    bar.style.width = '62%';

    if(junkRatio < 0.4 || allText.length < 500){
      st.textContent = 'Text layer looks broken — adding as manual book';
      sub.textContent = 'Do not worry — you can add chapters manually after closing this.';
      book.manualMode = true;
      await new Promise(r=>setTimeout(r,1200));
    } else {
      // Try AI-powered chapter extraction if key available
      if(DB.settings.apiKey){
        st.textContent = 'Extracting chapter structure with AI...';
        bar.style.width = '75%';
        try {
          const chapters = await extractChaptersAI(allText.slice(0, 30000));
          book.chapters = chapters;
          bar.style.width = '95%';
          st.textContent = `Found ${chapters.length} chapters`;
        } catch(e){
          sub.textContent = 'AI chapter extraction failed — you can add chapters manually.';
          book.manualMode = true;
        }
      } else {
        st.textContent = 'Basic structure detection (add API key for better results)';
        book.chapters = basicChapterDetect(allText);
      }
    }

    bar.style.width = '100%';
    st.textContent = '✅ Done!';
    DB.textbooks.push(book);
    saveDB();
    await new Promise(r=>setTimeout(r,800));

    document.querySelectorAll('.modal-back').forEach(x=>x.remove());
    toast('Textbook added successfully');
    go('syllabus');
    setTimeout(()=>viewBook(book.id), 200);
  } catch(e){
    st.textContent = '⚠️ Error: ' + e.message;
    sub.textContent = 'You can still add this book manually from the Syllabus view.';
    console.error(e);
  }
}

async function extractChaptersAI(text){
  const sys = `You extract chapter and topic structure from textbook text. Return ONLY valid JSON in this exact shape:
{"chapters":[{"number":"1","title":"Chapter Title","topics":[{"number":"1.1","title":"Topic Title"}]}]}
Do not include any other text.`;
  const user = `Extract chapters and topics from this textbook. Only return structure you can clearly see. If unsure, return fewer items.

TEXT:
${text}

Return JSON only.`;
  const out = await callAI(sys, user);
  const parsed = parseJSON(out);
  const chapters = (parsed.chapters||[]).map(c=>({
    id: uid(),
    number: c.number||'',
    title: c.title||'Untitled',
    topics: (c.topics||[]).map(t=>({
      id: uid(),
      number: t.number||'',
      title: t.title||'Untitled',
      content: ''
    }))
  }));
  return chapters;
}

function basicChapterDetect(text){
  const chapters = [];
  const lines = text.split(/\[Page \d+\]/).join('\n').split('\n');
  const rxChapter = /^\s*(chapter|unit)\s+(\d+|[IVX]+)[\s:.\-–]+(.+?)$/i;
  const rxNumbered = /^\s*(\d+)\s+([A-Z][^0-9]{4,80})$/;
  let current = null;
  lines.forEach(line=>{
    const l = line.trim();
    if(!l) return;
    const m1 = l.match(rxChapter);
    const m2 = l.match(rxNumbered);
    if(m1){
      current = {id: uid(), number: m1[2], title: m1[3].trim(), topics:[]};
      chapters.push(current);
    } else if(m2 && !current){
      current = {id: uid(), number: m2[1], title: m2[2].trim(), topics:[]};
      chapters.push(current);
    }
  });
  if(chapters.length === 0){
    // Add a default catch-all chapter
    chapters.push({id: uid(), number:'1', title:'Full Book Content', topics:[]});
  }
  return chapters;
}

    let source = '';
    let scope = book.title;
    if(tId){
      const ch = book.chapters.find(c=>c.id===chId);
      const t = ch?.topics?.find(x=>x.id===tId);
      source = t?.content || '';
      scope = `${book.title} > Ch ${ch.number||''} ${ch.title} > ${t.number||''} ${t.title}`;
      if(!source){ source = ch.title + '\n' + (t?.title||''); }
    } else if(chId){
      const ch = book.chapters.find(c=>c.id===chId);
      scope = `${book.title} > Ch ${ch.number||''} ${ch.title}`;
      source = ch.topics?.map(t=>`${t.number||''} ${t.title}\n${t.content||''}`).join('\n\n') || ch.title;
    } else {
      source = (book.rawText||'').slice(0, 20000) || book.chapters.map(c=>`${c.number} ${c.title}\n${(c.topics||[]).map(t=>t.number+' '+t.title).join('\n')}`).join('\n\n');
    }

    if(!source || source.length < 50){
      source = `Scope: ${scope}\nPlease generate questions appropriate for ${book.subject||'this subject'}, class ${book.grade||''}.`;
    }

    const typeInstructions = {
      mcq: 'Each question has: stem (string), options (array of 4 strings labeled A,B,C,D), answer (string: A/B/C/D), explanation (string).',
      short: 'Each question has: stem (string, short answer expected 2-4 sentences), answer (string: model answer), explanation (string, optional).',
      long: 'Each question has: stem (string, long descriptive answer expected), answer (string: model answer with key points), explanation (string, optional).',
      fill: 'Each question has: stem (string with ___ for blank), answer (string: the word/phrase for the blank), explanation (string, optional).',
      tf: 'Each question has: stem (string, statement), answer (string: "True" or "False"), explanation (string).'
    };

    const sys = `You are a senior curriculum specialist creating ${diff} difficulty ${type.toUpperCase()} questions for ${book.subject||'a subject'} class ${book.grade||''}. Generate exactly ${count} questions strictly based on the provided source material. Do NOT invent facts outside the source. Return ONLY a JSON object in this exact shape: {"questions":[ ... ]}. ${typeInstructions[type]}`;
    const user = `SCOPE: ${scope}
CUSTOM INSTRUCTIONS: ${custom || 'none'}

SOURCE MATERIAL:
${source}

Generate ${count} ${diff} ${type} questions. Return JSON only.`;

    const raw = await callAI(sys, user);
    const parsed = parseJSON(raw);
    const qs = parsed.questions || [];
    if(!qs.length) throw new Error('No questions parsed');

    // Save to bank
    const newQs = qs.map(q=>({
      id: uid(),
      textbookId: bookId, chapterId: chId||null, topicId: tId||null,
      type, difficulty: diff, stem: q.stem||'', options: q.options||[],
      answer: q.answer||'', explanation: q.explanation||'',
      scope, createdAt: Date.now()
    }));
    DB.questions.push(...newQs);
    saveDB();

    // Render preview
    preview.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b>${newQs.length} questions generated</b>
        <button class="btn btn-sm btn-teal" onclick="go('bank')">View in Bank →</button>
      </div>
      <div style="max-height:55vh;overflow:auto">
        ${newQs.map((q,i)=>renderQuestionCard(q,i+1)).join('')}
      </div>
    `;
    toast(`${newQs.length} questions added to Bank`);
  } catch(e){
    preview.innerHTML = `<div class="card" style="background:#FEF2F2;border-color:#FECACA;color:var(--danger)"><b>Error:</b> ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ Generate Questions';
  }
}

function renderQuestionCard(q, num){
  const opts = (q.options||[]).map((o,i)=>{
    const letter = String.fromCharCode(65+i);
    const isCorrect = q.answer && (q.answer.toUpperCase().startsWith(letter) || q.answer===o);
    return `<div class="qp-opt ${isCorrect?'correct':''}">${letter}. ${o}</div>`;
  }).join('');
  return `
    <div class="qp">
      <div class="qp-stem"><b>Q${num}.</b> ${q.stem}</div>
      ${q.options?.length ? `<div class="qp-opts">${opts}</div>` : ''}
      ${!q.options?.length && q.answer ? `<div style="font-size:13px;color:var(--teal);background:#E7F6EF;padding:6px 10px;border-radius:6px;margin-top:6px"><b>Answer:</b> ${q.answer}</div>`:''}
      ${q.explanation ? `<div style="font-size:12px;color:var(--mute);margin-top:6px"><b>Explanation:</b> ${q.explanation}</div>`:''}
      <div class="qp-meta">
        <span class="chip chip-sky">${q.type?.toUpperCase()}</span>
        <span class="chip">${q.difficulty}</span>
      </div>
    </div>`;
}

function updateSec(id, k, v){
  const s = examSections.find(x=>x.id===id);
  s[k]=v;
}

function buildPaper(){
  const title = document.getElementById('p_title').value.trim();
  if(!title){ toast('Enter paper title'); return }
  if(examSections.length===0){ toast('Add at least one section'); return }

  const bookFilter = document.getElementById('p_book').value;
  const sections = [];
  let usedIds = new Set();

  for(const s of examSections){
    let pool = DB.questions.filter(q=>q.type===s.type);
    if(bookFilter) pool = pool.filter(q=>q.textbookId===bookFilter);
    if(s.diff) pool = pool.filter(q=>q.difficulty===s.diff);
    pool = pool.filter(q=>!usedIds.has(q.id));
    // shuffle
    pool.sort(()=>Math.random()-0.5);
    const picked = pool.slice(0, s.count);
    picked.forEach(q=>usedIds.add(q.id));

    sections.push({
      id: s.id, title: s.title, type: s.type, marksPerQ: s.marks,
      questions: picked.map(q=>q.id),
      shortfall: Math.max(0, s.count - picked.length)
    });
  }

  const paper = {
    id: uid(),
    title,
    class: document.getElementById('p_class').value.trim(),
    subject: document.getElementById('p_subj').value.trim(),
    totalMarks: parseInt(document.getElementById('p_marks').value)||0,
    duration: parseInt(document.getElementById('p_time').value)||0,
    sections,
    bookId: bookFilter,
    createdAt: Date.now()
  };
  DB.papers.push(paper);
  saveDB();
  examSections = [];

  const shortfalls = sections.filter(s=>s.shortfall>0);
  if(shortfalls.length){
    toast(`Paper created — but ${shortfalls.map(s=>s.shortfall+' '+s.title).join(', ')} short. Generate more in the bank.`, 4500);
  } else {
    toast('Paper created successfully');
  }
  previewPaper(paper.id);
}

      html += `<div style="margin-bottom:10px;font-size:13px;line-height:1.6">

async function exportPaperPDF(id){
  const p = DB.papers.find(x=>x.id===id);
  if(!p){ toast('Paper not found'); return }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin = 40;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  let y = margin;

  function checkPage(needed=20){
    if(y + needed > pageH - margin){ doc.addPage(); y = margin; }
  }
  function text(str, x, opts={}){
    const size = opts.size||11;
    doc.setFontSize(size);
    doc.setFont(opts.font||'times', opts.style||'normal');
    const lines = doc.splitTextToSize(str, pageW - 2*margin - (x-margin));
    lines.forEach(ln=>{
      checkPage(size+4);
      doc.text(ln, x, y);
      y += size + 3;
    });
  }

  // Header
  doc.setFont('times','bold'); doc.setFontSize(14);
  doc.text(DB.settings.schoolName, pageW/2, y, {align:'center'}); y += 18;
  doc.setFontSize(12);
  doc.text(p.title, pageW/2, y, {align:'center'}); y += 14;
  doc.setFont('times','normal'); doc.setFontSize(10);
  doc.text(`Class: ${p.class||'—'}   Subject: ${p.subject||'—'}   Total Marks: ${p.totalMarks||'—'}   Time: ${p.duration||'—'} min`, pageW/2, y, {align:'center'});
  y += 16;
  doc.setDrawColor(11,44,77); doc.line(margin, y, pageW-margin, y); y += 16;
  doc.text('Name: ______________________________     Roll No: ____________     Date: ___________', margin, y);
  y += 20;

  let qNum = 1;
  p.sections.forEach((s)=>{
    checkPage(40);
    doc.setFont('times','bold'); doc.setFontSize(12);
    doc.text(s.title, margin, y);
    doc.setFont('times','italic'); doc.setFontSize(9);
    const secQs = s.questions.map(qid=>DB.questions.find(q=>q.id===qid)).filter(Boolean);
    const totalSecMarks = secQs.length * (s.marksPerQ||1);
    doc.text(`(${secQs.length} × ${s.marksPerQ} = ${totalSecMarks} marks)`, pageW-margin, y, {align:'right'});
    y += 16;

    doc.setFont('times','normal'); doc.setFontSize(11);
    secQs.forEach(q=>{
      checkPage(40);
      const stem = `Q${qNum}. ${q.stem}`;
      const stemLines = doc.splitTextToSize(stem, pageW - 2*margin - 30);
      stemLines.forEach((ln,i)=>{
        checkPage(14);
        doc.text(ln, margin, y);
        if(i===0) doc.text(`(${s.marksPerQ})`, pageW-margin, y, {align:'right'});
        y += 14;
      });
      if(q.options?.length){
        q.options.forEach((o,i)=>{
          checkPage(14);
          doc.text(`${String.fromCharCode(65+i)}. ${o}`, margin+20, y);
          y += 13;
        });
      }
      if(q.type==='short' || q.type==='long'){
        y += (q.type==='long'? 60 : 30);
      } else if(q.type==='fill'){
        y += 6;
      }
      y += 4;
      qNum++;
    });
    y += 8;
  });

  checkPage(30);
  doc.setFont('times','italic'); doc.setFontSize(10);
  doc.text('— End of Paper —', pageW/2, y, {align:'center'});

  // Answer key page
  doc.addPage(); y = margin;
  doc.setFont('times','bold'); doc.setFontSize(14);
  doc.text('Answer Key — '+p.title, pageW/2, y, {align:'center'}); y += 20;
  doc.setFont('times','normal'); doc.setFontSize(10);
  let n = 1;
  p.sections.forEach(s=>{
    s.questions.forEach(qid=>{
      const q = DB.questions.find(x=>x.id===qid);
      if(!q){ n++; return }
      checkPage(20);
      const line = `Q${n}. ${q.answer || '—'}`;
      const ll = doc.splitTextToSize(line, pageW - 2*margin);
      ll.forEach(l=>{ checkPage(12); doc.text(l, margin, y); y+=12 });
      if(q.explanation){
        doc.setFont('times','italic'); doc.setFontSize(9);
        const el = doc.splitTextToSize('Explanation: '+q.explanation, pageW-2*margin-20);
        el.forEach(l=>{ checkPage(11); doc.text(l, margin+10, y); y+=11 });
        doc.setFont('times','normal'); doc.setFontSize(10);
      }
      y += 4;
      n++;
    });
  });

  doc.save(p.title.replace(/[^a-z0-9]+/gi,'_') + '.pdf');
  toast('PDF downloaded');
}

  DB.papers = DB.papers.filter(p=>p.id!==id);

async function generateLessonPlan(){
  const type = document.getElementById('l_type').value;
  const cls = document.getElementById('l_class').value.trim();
  const bookId = document.getElementById('l_book').value;
  const chId = document.getElementById('l_chapter').value;
  const dur = document.getElementById('l_dur').value;
  const notes = document.getElementById('l_notes').value.trim();

  const book = DB.textbooks.find(b=>b.id===bookId);
  if(!book){ toast('Select a book'); return }
  const chapter = chId ? book.chapters.find(c=>c.id===chId) : null;

  const btn = document.getElementById('lbtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';

  try {
    const scope = chapter ? `Chapter ${chapter.number||''}: ${chapter.title}` : 'Full book';
    const sourceContent = chapter
      ? (chapter.topics||[]).map(t=>`${t.number||''} ${t.title}\n${t.content||''}`).join('\n\n') || chapter.title
      : (book.chapters.map(c=>`Ch ${c.number} ${c.title}: ${(c.topics||[]).map(t=>t.title).join(', ')}`).join('\n'));

    const sys = `You are a senior curriculum specialist. Generate a ${type} lesson plan. Return ONLY JSON in this exact shape:
{
  "title": "...",
  "overview": "...",
  "learningObjectives": ["..."],
  "keyConcepts": ["..."],
  "prerequisites": ["..."],
  "materials": ["..."],
  "timeBreakdown": [{"phase":"Introduction","minutes":5,"activity":"..."}, ...],
  "teachingStrategy": ["step 1", "step 2"],
  "classActivities": ["..."],
  "homework": ["..."],
  "engagementQuestions": ["..."],
  "assessment": ["..."],
  "closureSummary": "..."
}`;
    const user = `PLAN TYPE: ${type}
CLASS: ${cls||'—'}
SUBJECT: ${book.subject||'—'}  GRADE: ${book.grade||'—'}
SCOPE: ${scope}
PERIOD: ${dur} minutes
NOTES: ${notes||'none'}

CONTENT:
${sourceContent}

Generate a complete lesson plan in the JSON schema. Return JSON only.`;

    const raw = await callAI(sys, user);
    const plan = parseJSON(raw);
    const saved = {
      id: uid(),
      title: plan.title || `${type} Plan — ${scope}`,
      class: cls,
      subject: book.subject,
      planType: type,
      bookId,
      chapterId: chId,
      plan,
      createdAt: Date.now()
    };
    DB.lessonPlans.push(saved);
    saveDB();
    toast('Lesson plan saved');
    previewLessonPlan(saved.id);
  } catch(e){
    toast('Error: '+e.message, 4000);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🎓 Generate Plan';
  }
}

function exportLessonPDF(id){
  const p = DB.lessonPlans.find(x=>x.id===id);
  if(!p) return;
  const pl = p.plan||{};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a4'});
  const margin = 40; const pageW = doc.internal.pageSize.getWidth(); const pageH = doc.internal.pageSize.getHeight();
  let y = margin;

  function addH(text, size=14){
    if(y + size*2 > pageH - margin){ doc.addPage(); y = margin; }
    doc.setFont('times','bold'); doc.setFontSize(size);
    doc.setTextColor(11,44,77);
    doc.text(text, margin, y); y += size + 6;
    doc.setTextColor(0,0,0);
  }
  function addP(text, size=11){
    doc.setFont('times','normal'); doc.setFontSize(size);
    const lines = doc.splitTextToSize(text, pageW - 2*margin);
    lines.forEach(l=>{
      if(y + 13 > pageH - margin){ doc.addPage(); y = margin; }
      doc.text(l, margin, y); y += size + 2;
    });
    y += 4;
  }
  function addList(items, ordered=false){
    doc.setFont('times','normal'); doc.setFontSize(11);
    items.forEach((it,i)=>{
      const prefix = ordered ? `${i+1}. ` : '• ';
      const lines = doc.splitTextToSize(prefix + it, pageW - 2*margin - 14);
      lines.forEach((l,j)=>{
        if(y + 13 > pageH - margin){ doc.addPage(); y = margin; }
        doc.text(l, margin + (j===0?0:14), y); y += 13;
      });
    });
    y += 4;
  }

  addH(p.title, 16);
  doc.setFont('times','italic'); doc.setFontSize(10);
  doc.text(`${DB.settings.schoolName} • ${p.class||''} • ${p.subject||''} • ${p.planType} plan`, margin, y); y+= 18;

  if(pl.overview){ addH('Overview'); addP(pl.overview); }
  if(pl.learningObjectives?.length){ addH('Learning Objectives'); addList(pl.learningObjectives); }
  if(pl.keyConcepts?.length){ addH('Key Concepts'); addP(pl.keyConcepts.join(', ')); }
  if(pl.prerequisites?.length){ addH('Prerequisites'); addList(pl.prerequisites); }
  if(pl.materials?.length){ addH('Materials'); addList(pl.materials); }
  if(pl.timeBreakdown?.length){ addH('Time Breakdown'); addList(pl.timeBreakdown.map(t=>`${t.phase} (${t.minutes} min) — ${t.activity}`)); }
  if(pl.teachingStrategy?.length){ addH('Teaching Strategy'); addList(pl.teachingStrategy, true); }
  if(pl.classActivities?.length){ addH('Class Activities'); addList(pl.classActivities); }
  if(pl.engagementQuestions?.length){ addH('Engagement Questions'); addList(pl.engagementQuestions); }
  if(pl.assessment?.length){ addH('Assessment'); addList(pl.assessment); }
  if(pl.homework?.length){ addH('Homework'); addList(pl.homework); }
  if(pl.closureSummary){ addH('Closure / Summary'); addP(pl.closureSummary); }

  doc.save((p.title||'lesson-plan').replace(/[^a-z0-9]+/gi,'_') + '.pdf');
  toast('PDF downloaded');
}

function quickAsk(prompt){
  document.getElementById('chatInput').value = prompt;

async function sendChat(){
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if(!txt) return;
  input.value = '';
  chatHistory.push({role:'user', content: txt});
  renderChat();
  chatHistory.push({role:'assistant', content: '...'});
  renderChat();

  try {
    // Build a context from books
    const bookCtx = DB.textbooks.slice(0,3).map(b=>{
      return `Book: ${b.title} (${b.subject||''}, class ${b.grade||''})\n${b.chapters.slice(0,5).map(c=>`  - Ch ${c.number||''} ${c.title}`).join('\n')}`;
    }).join('\n\n');

    const sys = `You are an expert teaching assistant for ${DB.settings.schoolName}. Help teachers explain topics, design activities, and improve lessons.
Current teacher has these textbooks:
${bookCtx || '(no books uploaded yet)'}

Keep answers practical, structured, and tuned for a Pakistani school context. Use simple English. Use bullet points where helpful.`;

    const userCombined = chatHistory.filter(m=>m.role==='user').map(m=>m.content).join('\n\nFollowup: ');
    const raw = await callAI(sys, userCombined, {jsonMode:false});
    chatHistory[chatHistory.length-1] = {role:'assistant', content: raw};
    renderChat();
  } catch(e){
    chatHistory[chatHistory.length-1] = {role:'assistant', content: '⚠️ Error: '+e.message};
    renderChat();
  }
}

function renderChat(){
  const el = document.getElementById('chatMsgs');
  if(!el) return;
  el.innerHTML = chatHistory.map(m=>`<div class="chat-msg ${m.role==='user'?'user':'bot'}">${m.content}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function restoreBackup(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.textbooks) throw new Error('Invalid backup');
      modal({
        title:'Restore backup?',
        body:`<p>This will replace your current data with the backup. ${data.textbooks?.length||0} books, ${data.questions?.length||0} questions will be loaded.</p>`,
        actions:[
          {label:'Cancel', onClick:c=>c()},
          {label:'Restore', primary:true, onClick:(c)=>{
            DB = {...defaultDB, ...data, settings:{...defaultDB.settings, ...(data.settings||{})}};
            saveDB(); c(); render(); toast('Backup restored');
          }}
        ]
      });
    }catch(err){ toast('Invalid backup file') }
  };
  r.readAsText(f);
  ev.target.value = '';
}

function resetAll(){
  modal({
    title:'Reset all data?',
    body:'<p><b>Warning:</b> All textbooks, questions, papers, lesson plans and settings will be permanently deleted.</p>',
    actions:[
      {label:'Cancel', onClick:c=>c()},
      {label:'Reset Everything', primary:true, onClick:(c)=>{
        localStorage.removeItem(DB_KEY);
        DB = loadDB(); c(); render(); toast('All data cleared');
      }}
    ]
  });
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  const main = document.getElementById('main');
  let html = '';
  switch(currentView){
    case 'dashboard': html = viewDashboard(); break;
    case 'upload': html = viewUpload(); break;
    case 'syllabus': html = viewSyllabus(); break;
    case 'qgen': html = viewQgen(); break;
    case 'bank': html = viewBank(); break;
    case 'exam': html = viewExam(); break;
    case 'lesson': html = viewLesson(); break;
    case 'assistant': html = viewAssistant(); break;
    case 'settings': html = viewSettings(); break;
    case 'about': html = viewAbout(); break;
  }
  main.innerHTML = html;

  // Post-render hooks
  if(currentView === 'upload') attachUploadHandlers();
  if(currentView === 'qgen') {
    renderChapterSelect();
    if(window._qgenPrefill){
      setTimeout(()=>{
        if(window._qgenPrefill.bookId) document.getElementById('g_book').value = window._qgenPrefill.bookId;
        renderChapterSelect();
        if(window._qgenPrefill.chapterId) document.getElementById('g_chapter').value = window._qgenPrefill.chapterId;
        renderTopicSelect();
        if(window._qgenPrefill.topicId) document.getElementById('g_topic').value = window._qgenPrefill.topicId;
        window._qgenPrefill = null;
      }, 50);
    }
  }
  if(currentView === 'exam'){
    renderSections();
  }
  if(currentView === 'lesson'){
    renderLessonChapterSelect();
  }
}

function attachUploadHandlers(){
  const dz = document.getElementById('dz');
  const fi = document.getElementById('fileInput');
  if(!dz || !fi) return;
  fi.addEventListener('change', e=> handleFile(e.target.files[0]));
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('dragover'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });
}

// First render
render();

// First-run welcome
if(!DB.settings.apiKey && DB.textbooks.length === 0){

      actions:[
        {label:'Later', onClick:c=>c()},
        {label:'Go to Settings', primary:true, onClick:(c)=>{c(); go('settings');}}
      ]
    });
  }, 400);
}
